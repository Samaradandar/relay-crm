[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-crm-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "procrastinate[sqlalchemy]>=2.0",
  "boto3>=1.35",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "email-validator>=2.2",
  "psycopg[binary,pool]>=3.2",
  "websockets>=13",
  "tzdata",
  "phonenumbers>=8.13",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "pgserver>=0.1.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
extend-exclude = ["demo"]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"scripts/loadtest.py" = ["E501"]  # long SQL strings
"scripts/seed_demo.py" = ["E501"]  # demo data tables

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.platform.*", "app.core.*"]
strict = true

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
source = ["app"]
omit = ["app/modules/billing/*", "app/modules/capture/*", "app/modules/churn/*", "app/modules/customers/*",
        "app/modules/integrations/*", "app/modules/ml/*", "app/modules/performance/*",
        "app/modules/proposals/*", "app/modules/reports/*",
        "app/modules/usage_feed/*"]
